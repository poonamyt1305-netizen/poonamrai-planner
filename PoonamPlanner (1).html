<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Poonam's Planner"/>
<title>Poonam's Planner 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--pu:#9333ea;--in:#6366f1;--mn:#10b981;--bg:#f4f1ff;--card:#fff;--tx:#1e1b2e;--sub:#7c6b8a;--br:#ede9fe}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif}
.app{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available;max-width:430px;margin:0 auto;overflow:hidden}
.hdr{background:linear-gradient(135deg,#9333ea,#6366f1,#ec4899);padding:48px 20px 28px;flex-shrink:0;border-radius:0 0 28px 28px}
.hi{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:1.2px;text-transform:uppercase}
.hname{font-size:26px;font-weight:900;color:#fff;margin-top:2px}
.hdate{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px;font-weight:600}
.htrack{background:rgba(255,255,255,.25);border-radius:20px;height:7px;margin-top:12px}
.hbar{background:#fff;border-radius:20px;height:7px;transition:width .5s}
.hinfo{display:flex;justify-content:space-between;margin-top:4px}
.hinfo span{font-size:11px;color:rgba(255,255,255,.8);font-weight:700}
.cats{display:flex;margin:14px 14px 4px;background:var(--card);border-radius:16px;padding:4px;box-shadow:0 2px 14px rgba(99,102,241,.13);flex-shrink:0}
.cbtn{flex:1;padding:10px 6px;border:none;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;background:transparent;color:var(--sub);transition:all .2s;font-family:'Nunito',sans-serif}
.cbtn.on{background:linear-gradient(135deg,#9333ea,#6366f1);color:#fff;box-shadow:0 3px 10px rgba(99,102,241,.35)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 0}
.sec{display:none;padding-bottom:90px}.sec.on{display:block}
.slbl{font-size:11px;font-weight:800;color:#9c8bb0;letter-spacing:1.2px;text-transform:uppercase;margin:12px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.cnt{font-size:10px;background:#ede9fe;color:#6d28d9;padding:2px 8px;border-radius:20px;font-weight:800;text-transform:none;letter-spacing:0}
.tc{background:var(--card);border-radius:18px;padding:13px 12px;margin-bottom:9px;display:flex;align-items:center;gap:11px;border:1.5px solid #fce7f3;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.tc.pro{border-color:#e0e7ff}.tc.past{border-color:#fee2e2;background:#fff8f8}.tc.done{opacity:.5}
.chk{width:26px;height:26px;border-radius:50%;border:2.5px solid #c4b5fd;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;background:transparent;transition:all .2s}
.chk.on{background:linear-gradient(135deg,#10b981,#059669);border-color:#10b981}
.ti{flex:1;min-width:0}
.tn{font-size:14px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn.done{text-decoration:line-through;color:#9c8bb0}
.ts{font-size:10px;color:#9c8bb0;margin-top:2px;font-weight:600}
.chip{font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.chip.t{background:#ede9fe;color:#5b21b6}.chip.od{background:#fee2e2;color:#991b1b}.chip.dn{background:#d1fae5;color:#065f46}
.del{width:28px;height:28px;border-radius:50%;background:#fee2e2;border:none;color:#ef4444;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900}
.add{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:10px}
.atitle{font-size:11px;font-weight:800;color:#7c3aed;margin-bottom:10px;text-transform:uppercase;letter-spacing:.8px}
.inp{width:100%;padding:12px 13px;border:2px solid #ede9fe;border-radius:13px;font-size:15px;font-weight:600;color:var(--tx);background:#fafaf9;margin-bottom:8px;outline:none;font-family:'Nunito',sans-serif;-webkit-appearance:none}
.inp:focus{border-color:#7c3aed;background:#fff}
.abtn{width:100%;padding:13px;background:linear-gradient(135deg,#9333ea,#6366f1);color:#fff;border:none;border-radius:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif}
.abtn:active{opacity:.85}
.dstrip{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 8px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dpill{display:flex;flex-direction:column;align-items:center;padding:8px 10px;border-radius:14px;cursor:pointer;border:2px solid #ede9fe;background:var(--card);flex-shrink:0;min-width:50px;transition:all .2s;position:relative}
.dpill.on{background:linear-gradient(135deg,#9333ea,#6366f1);border-color:transparent;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.dpill.hasod{border-color:#fca5a5}
.dpill.hasod::after{content:'';width:7px;height:7px;background:#ef4444;border-radius:50%;position:absolute;top:4px;right:4px;border:1.5px solid #fff}
.dpill.on.hasod{border-color:transparent}
.dn2{font-size:10px;font-weight:800;color:#9c8bb0;text-transform:uppercase}
.dnum{font-size:16px;font-weight:800;color:var(--tx);margin-top:1px}
.dpill.on .dn2,.dpill.on .dnum{color:#fff}
.tdot{width:5px;height:5px;background:#f472b6;border-radius:50%;margin-top:3px}
.dpill.on .tdot{background:rgba(255,255,255,.7)}
.pbox{background:linear-gradient(135deg,#fdf4ff,#ede9fe);border-radius:20px;padding:24px 16px;text-align:center;margin-bottom:12px;border:1.5px solid #e9d5ff}
.pamt{font-size:40px;font-weight:900;color:#059669}
.psub{font-size:12px;color:var(--sub);font-weight:700;margin-top:3px}
.prule{font-size:12px;background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 13px;margin-bottom:12px;font-weight:700;text-align:center}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pbtn{padding:12px;border:none;border-radius:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif}
.padd{background:#d1fae5;color:#065f46}.prst{background:#fee2e2;color:#991b1b}
.logc{background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.logn{font-size:12px;font-weight:600;color:var(--tx);flex:1}.loga{font-size:13px;font-weight:800;color:#059669}
.rmc{background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:11px;border:1.5px solid #ede9fe}
.rtime{background:#fdf4ff;color:#7c3aed;font-size:13px;font-weight:800;padding:7px 11px;border-radius:11px;white-space:nowrap;flex-shrink:0}
.rname{font-size:14px;font-weight:700;color:var(--tx)}.rnote{font-size:10px;color:#9c8bb0;font-weight:600;margin-top:2px}
.dghdr{font-size:11px;font-weight:800;color:#9c8bb0;letter-spacing:1px;text-transform:uppercase;margin:12px 2px 7px;display:flex;justify-content:space-between;align-items:center}
.dghdr span{font-size:10px;background:#ede9fe;color:#5b21b6;padding:2px 8px;border-radius:10px;font-weight:800;text-transform:none;letter-spacing:0}
.pban{background:#fff1f2;border:1.5px solid #fecdd3;border-radius:14px;padding:11px 13px;margin-bottom:11px;display:flex;gap:9px;align-items:flex-start}
.pban-t{font-size:13px;font-weight:800;color:#9f1239}.pban-s{font-size:11px;color:#b45309;font-weight:600;margin-top:2px}
.empty{text-align:center;padding:28px 12px;color:#9c8bb0}
.eico{font-size:36px;margin-bottom:7px}.etxt{font-size:15px;font-weight:700}.esub{font-size:13px;margin-top:3px}
.nav{display:flex;background:var(--card);padding:8px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 18px rgba(0,0,0,.08);flex-shrink:0}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:2px;position:relative}
.nico{font-size:22px;line-height:1}.nlbl{font-size:10px;font-weight:800;color:#9c8bb0}
.ni.on .nlbl{color:#7c3aed}
.ndot{width:5px;height:5px;background:#7c3aed;border-radius:50%;display:none}
.ni.on .ndot{display:block}
.nbadge{position:absolute;top:-1px;right:4px;background:#ef4444;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:8px;min-width:15px;text-align:center;display:none}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(14px);background:#1e1b2e;color:#fff;padding:11px 20px;border-radius:16px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hi">Hello there 👋</div>
    <div class="hname">Hi Poonam! 🌸</div>
    <div class="hdate" id="hdate"></div>
    <div class="htrack"><div class="hbar" id="hbar" style="width:0%"></div></div>
    <div class="hinfo"><span id="hprog">0 of 0 done today</span><span id="hpct">0%</span></div>
  </div>
  <div class="cats" id="cats">
    <button class="cbtn on" onclick="setCat('personal')">🌸 Personal</button>
    <button class="cbtn" onclick="setCat('professional')">💼 Professional</button>
  </div>
  <div class="body">
    <div id="s-today" class="sec on">
      <div class="slbl" id="td-lbl">Today</div>
      <div id="today-list"></div>
      <div class="add">
        <div class="atitle">+ Add task today</div>
        <input class="inp" id="td-i" placeholder="Kya karna hai aaj?"/>
        <input class="inp" id="td-t" type="time"/>
        <button class="abtn" onclick="addToday()">Add Task ✅</button>
      </div>
    </div>
    <div id="s-week" class="sec">
      <div class="dstrip" id="dstrip"></div>
      <div class="slbl" id="wk-lbl">Tasks</div>
      <div id="week-list"></div>
      <div class="add">
        <div class="atitle" id="wk-at">+ Plan this day</div>
        <input class="inp" id="wk-i" placeholder="Is din ke liye task..."/>
        <input class="inp" id="wk-t" type="time"/>
        <button class="abtn" onclick="addWeek()">Add to Plan 📅</button>
      </div>
    </div>
    <div id="s-pending" class="sec"><div id="pending-list"></div></div>
    <div id="s-history" class="sec">
      <div class="slbl">Last 30 days 📋</div>
      <div id="history-list"></div>
    </div>
    <div id="s-remind" class="sec">
      <div class="slbl">Reminders 🔔</div>
      <div id="rem-list"></div>
      <div class="add">
        <div class="atitle">+ New reminder</div>
        <input class="inp" id="rm-i" placeholder="Reminder..."/>
        <input class="inp" id="rm-t" type="time"/>
        <button class="abtn" onclick="addRem()">Set Reminder 🔔</button>
      </div>
    </div>
    <div id="s-piggy" class="sec">
      <div class="pbox">
        <div style="font-size:48px;margin-bottom:6px">🐷</div>
        <div class="pamt" id="pigamt">₹0</div>
        <div class="psub">Tumhari penalty jar</div>
      </div>
      <div class="prule">Har skipped task = ₹10 automatic! 💰</div>
      <div class="pbtns">
        <button class="pbtn padd" onclick="manualPig()">+ Add ₹10</button>
        <button class="pbtn prst" onclick="resetPig()">🔄 Reset</button>
      </div>
      <div class="slbl">History</div>
      <div id="pig-log"></div>
    </div>
  </div>
  <div class="nav">
    <div class="ni on" id="nav-today" onclick="goTo('today')"><span class="nico">☀️</span><span class="nlbl">Today</span><div class="ndot"></div></div>
    <div class="ni" id="nav-week" onclick="goTo('week')"><span class="nico">📅</span><span class="nlbl">Week</span><div class="ndot"></div></div>
    <div class="ni" id="nav-pending" onclick="goTo('pending')"><span class="nico">⚠️</span><span class="nlbl">Pending</span><div class="ndot"></div><div class="nbadge" id="pbadge"></div></div>
    <div class="ni" id="nav-history" onclick="goTo('history')"><span class="nico">📋</span><span class="nlbl">History</span><div class="ndot"></div></div>
    <div class="ni" id="nav-remind" onclick="goTo('remind')"><span class="nico">🔔</span><span class="nlbl">Remind</span><div class="ndot"></div></div>
    <div class="ni" id="nav-piggy" onclick="goTo('piggy')"><span class="nico">🐷</span><span class="nlbl">Piggy</span><div class="ndot"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SH=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let cat='personal',screen='today',wkOff=0;
let S={tasks:{},reminders:[],piggy:0,piggyLog:[]};
function save(){try{localStorage.setItem('pnm_v1',JSON.stringify(S));}catch(e){}}
function load(){try{const r=localStorage.getItem('pnm_v1');if(r)S=JSON.parse(r);}catch(e){}}
function dk(d){return d.toISOString().split('T')[0];}
function today(){return dk(new Date());}
function offD(n){const d=new Date();d.setDate(d.getDate()+n);return d;}
function K(ds,c){return ds+'|'+(c||cat);}
function getTasks(ds,c){return S.tasks[K(ds,c)]||[];}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2400);}
function goTo(s){
  ['today','week','pending','history','remind','piggy'].forEach(x=>{
    document.getElementById('s-'+x).classList.toggle('on',x===s);
    document.getElementById('nav-'+x).classList.toggle('on',x===s);
  });
  screen=s;
  document.getElementById('cats').style.display=(s==='today'||s==='week')?'flex':'none';
  ({today:renderToday,week:renderWeek,pending:renderPending,history:renderHistory,remind:renderRemind,piggy:renderPiggy})[s]?.();
}
function setCat(c){
  cat=c;
  document.querySelectorAll('.cbtn').forEach((el,i)=>el.classList.toggle('on',['personal','professional'][i]===c));
  screen==='today'?renderToday():screen==='week'?renderWeek():null;
}
function renderToday(){
  const ts=today();const k=K(ts,cat);if(!S.tasks[k])S.tasks[k]=[];
  const tasks=S.tasks[k];const done=tasks.filter(t=>t.done).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  document.getElementById('hbar').style.width=pct+'%';
  document.getElementById('hprog').textContent=done+' of '+tasks.length+' done today';
  document.getElementById('hpct').textContent=pct+'%';
  document.getElementById('td-lbl').textContent=(cat==='personal'?'🌸 Personal':'💼 Professional')+' — Today';
  const list=document.getElementById('today-list');
  if(!tasks.length){list.innerHTML='<div class="empty"><div class="eico">✨</div><div class="etxt">All clear!</div><div class="esub">Neeche task add karo</div></div>';return;}
  list.innerHTML=tasks.map((t,i)=>`<div class="tc ${cat==='professional'?'pro':''} ${t.done?'done':''}">
    <div class="chk ${t.done?'on':''}" onclick="togToday(${i})">${t.done?'✓':''}</div>
    <div class="ti"><div class="tn ${t.done?'done':''}">${t.label}</div><div class="ts">${t.fromWeek?'📅 Weekly plan se':'✏️ Aaj add kiya'}</div></div>
    ${t.time?`<span class="chip t">${t.time}</span>`:''}
    <button class="del" onclick="delToday(${i})">✕</button>
  </div>`).join('');
  updateBadge();
}
function togToday(i){const k=K(today(),cat);S.tasks[k][i].done=!S.tasks[k][i].done;if(S.tasks[k][i].done)toast('✅ Shabash Poonam!');save();renderToday();}
function delToday(i){const k=K(today(),cat);const t=S.tasks[k][i];if(!t.done){S.piggy+=10;S.piggyLog.unshift({note:'Skipped: '+t.label,d:fmtD(new Date())});toast('🐷 ₹10 piggy mein!');}S.tasks[k].splice(i,1);save();renderToday();}
function addToday(){
  const label=document.getElementById('td-i').value.trim();const time=document.getElementById('td-t').value;
  if(!label)return;const k=K(today(),cat);if(!S.tasks[k])S.tasks[k]=[];
  S.tasks[k].push({label,time,done:false,fromWeek:false});
  document.getElementById('td-i').value='';document.getElementById('td-t').value='';
  if(time)schedRem(label,time);save();renderToday();toast('✅ Task add ho gaya!');
}
function renderWeek(){
  let pills='';
  for(let o=-30;o<=14;o++){
    const d=offD(o);const ds=dk(d);const tasks=getTasks(ds,cat);
    const hasOD=o<0&&tasks.some(t=>!t.done);const isSel=o===wkOff;const isToday=o===0;
    pills+=`<div class="dpill ${isSel?'on':''} ${hasOD?'hasod':''}" onclick="selWk(${o})">
      <span class="dn2">${SH[d.getDay()]}</span><span class="dnum">${d.getDate()}</span>
      ${isToday?'<div class="tdot"></div>':''}
    </div>`;
  }
  document.getElementById('dstrip').innerHTML=pills;
  setTimeout(()=>{const s=document.getElementById('dstrip');const p=s.children[wkOff+30];if(p)p.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},50);
  const selD=offD(wkOff);const ds=dk(selD);const tasks=getTasks(ds,cat);const isPast=wkOff<0;
  document.getElementById('wk-lbl').textContent=(cat==='personal'?'🌸':'💼')+' '+fmtD(selD);
  document.getElementById('wk-at').textContent=isPast?'+ Add (purane din mein)':'+ Plan this day';
  const list=document.getElementById('week-list');
  if(!tasks.length){list.innerHTML=`<div class="empty"><div class="eico">${isPast?'📂':'📅'}</div><div class="etxt">${isPast?'Kuch nahi tha':'Kuch plan nahi'}</div><div class="esub">${isPast?'Add karo neeche':'Tasks add karo'}</div></div>`;return;}
  list.innerHTML=tasks.map((t,i)=>`<div class="tc ${cat==='professional'?'pro':''} ${t.done?'done':''} ${isPast&&!t.done?'past':''}">
    <div class="chk ${t.done?'on':''}" onclick="togWeek('${ds}',${i})">${t.done?'✓':''}</div>
    <div class="ti"><div class="tn ${t.done?'done':''}">${t.label}</div><div class="ts">${fmtD(selD)}</div></div>
    ${isPast&&!t.done?'<span class="chip od">Overdue</span>':t.done?'<span class="chip dn">Done ✓</span>':(t.time?`<span class="chip t">${t.time}</span>`:'')}
    <button class="del" onclick="delWeek('${ds}',${i})">✕</button>
  </div>`).join('');
}
function selWk(o){wkOff=o;renderWeek();}
function togWeek(ds,i){const k=K(ds,cat);if(!S.tasks[k])return;S.tasks[k][i].done=!S.tasks[k][i].done;if(S.tasks[k][i].done)toast('✅ Done!');save();renderWeek();updateBadge();}
function delWeek(ds,i){const k=K(ds,cat);const t=S.tasks[k][i];if(!t.done){S.piggy+=10;S.piggyLog.unshift({note:'Skipped: '+t.label,d:fmtD(new Date())});toast('🐷 ₹10!');}S.tasks[k].splice(i,1);save();renderWeek();updateBadge();}
function addWeek(){
  const label=document.getElementById('wk-i').value.trim();const time=document.getElementById('wk-t').value;if(!label)return;
  const ds=dk(offD(wkOff));const k=K(ds,cat);if(!S.tasks[k])S.tasks[k]=[];
  S.tasks[k].push({label,time,done:false});
  if(wkOff===0){const tk=K(today(),cat);if(!S.tasks[tk])S.tasks[tk]=[];if(!S.tasks[tk].find(x=>x.label===label))S.tasks[tk].push({label,time,done:false,fromWeek:true});}
  document.getElementById('wk-i').value='';document.getElementById('wk-t').value='';
  if(time)schedRem(label,time);save();renderWeek();toast('📅 Plan mein add ho gaya!');
}
function getAllPending(){
  const ts=today();const res=[];
  Object.keys(S.tasks).forEach(k=>{const[ds,c]=k.split('|');if(ds>=ts)return;S.tasks[k].forEach((t,i)=>{if(!t.done)res.push({...t,_k:k,_i:i,_ds:ds,_c:c});});});
  return res.sort((a,b)=>b._ds.localeCompare(a._ds));
}
function updateBadge(){const n=getAllPending().length;const b=document.getElementById('pbadge');b.textContent=n;b.style.display=n?'block':'none';}
function renderPending(){
  const p=getAllPending();const list=document.getElementById('pending-list');
  if(!p.length){list.innerHTML='<div class="slbl">All pending</div><div class="empty"><div class="eico">🎉</div><div class="etxt">Sab complete!</div><div class="esub">Poonam you are amazing! 🌸</div></div>';return;}
  list.innerHTML=`<div class="slbl">Pending tasks <span class="cnt">${p.length}</span></div>
  <div class="pban"><div style="font-size:20px">⚠️</div><div><div class="pban-t">${p.length} task baaki hain</div><div class="pban-s">Tick karo ya hatao — hatane se ₹10 jayenge</div></div></div>`
  +p.map(t=>`<div class="tc ${t._c==='professional'?'pro':''} past">
    <div class="chk" onclick="donePen('${t._k}',${t._i})">○</div>
    <div class="ti"><div class="tn">${t.label}</div><div class="ts">${t._c==='personal'?'🌸 Personal':'💼 Professional'} · ${fmtDs(t._ds)}</div></div>
    <span class="chip od">Overdue</span>
    <button class="del" onclick="skipPen('${t._k}',${t._i})">✕</button>
  </div>`).join('');
}
function donePen(k,i){if(!S.tasks[k]||!S.tasks[k][i])return;S.tasks[k][i].done=true;save();renderPending();updateBadge();toast('✅ Shabash Poonam!');}
function skipPen(k,i){if(!S.tasks[k]||!S.tasks[k][i])return;S.piggy+=10;S.piggyLog.unshift({note:'Skipped: '+S.tasks[k][i].label,d:fmtD(new Date())});S.tasks[k].splice(i,1);save();renderPending();updateBadge();toast('🐷 ₹10 add!');}
function renderHistory(){
  const ts=today();const d30=new Date();d30.setDate(d30.getDate()-30);const floor=dk(d30);
  const groups={};
  Object.keys(S.tasks).forEach(k=>{const[ds]=k.split('|');if(ds>ts||ds<floor)return;if(!groups[ds])groups[ds]=[];S.tasks[k].forEach(t=>groups[ds].push({...t,_c:k.split('|')[1]}));});
  const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  const list=document.getElementById('history-list');
  if(!dates.length){list.innerHTML='<div class="empty"><div class="eico">📋</div><div class="etxt">Koi history nahi</div><div class="esub">Tasks add karo!</div></div>';return;}
  list.innerHTML=dates.map(ds=>{
    const tasks=groups[ds];const done=tasks.filter(t=>t.done).length;const isToday=ds===ts;
    return `<div class="dghdr">${isToday?'Aaj — ':''}${fmtDs(ds)}<span>${done}/${tasks.length}</span></div>
    ${tasks.map(t=>`<div class="tc ${t._c==='professional'?'pro':''} ${t.done?'done':''} ${!t.done&&ds<ts?'past':''}">
      <div class="chk ${t.done?'on':''}">${t.done?'✓':'○'}</div>
      <div class="ti"><div class="tn ${t.done?'done':''}">${t.label}</div><div class="ts">${t._c==='personal'?'🌸 Personal':'💼 Professional'}</div></div>
      ${t.done?'<span class="chip dn">Done ✓</span>':ds<ts?'<span class="chip od">Pending</span>':''}
    </div>`).join('')}`;
  }).join('');
}
function renderRemind(){
  const list=document.getElementById('rem-list');
  if(!S.reminders.length){list.innerHTML='<div class="empty"><div class="eico">🔔</div><div class="etxt">Koi reminder nahi</div><div class="esub">Neeche add karo</div></div>';return;}
  list.innerHTML=S.reminders.map((r,i)=>`<div class="rmc">
    <span class="rtime">${r.time}</span>
    <div style="flex:1"><div class="rname">${r.label}</div><div class="rnote">⚡ 5 min pehle bhi alert milega</div></div>
    <button class="del" onclick="delRem(${i})">✕</button>
  </div>`).join('');
}
function addRem(){
  const label=document.getElementById('rm-i').value.trim();const time=document.getElementById('rm-t').value;
  if(!label||!time){toast('Dono fields bharo!');return;}
  S.reminders.push({label,time});schedRem(label,time);
  document.getElementById('rm-i').value='';document.getElementById('rm-t').value='';
  save();renderRemind();toast('🔔 Reminder set: '+time);
}
function delRem(i){S.reminders.splice(i,1);save();renderRemind();}
function renderPiggy(){
  document.getElementById('pigamt').textContent='₹'+S.piggy;
  const log=document.getElementById('pig-log');
  if(!S.piggyLog.length){log.innerHTML='<div class="empty"><div class="eico">💰</div><div class="etxt">Koi entry nahi</div><div class="esub">Tasks complete karo!</div></div>';return;}
  log.innerHTML=S.piggyLog.slice(0,20).map(e=>`<div class="logc"><span class="logn">${e.note}${e.d?' · '+e.d:''}</span><span class="loga">+₹10</span></div>`).join('');
}
function manualPig(){S.piggy+=10;S.piggyLog.unshift({note:'Manual entry',d:fmtD(new Date())});save();renderPiggy();toast('🐷 ₹10 add!');}
function resetPig(){if(confirm('Piggy bank reset karna?')){S.piggy=0;S.piggyLog=[];save();renderPiggy();toast('Reset ho gaya!');}}
function fmtD(d){return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
function fmtDs(s){return fmtD(new Date(s+'T00:00:00'));}
function schedRem(label,ts){
  const n=new Date();const[h,m]=ts.split(':').map(Number);
  const t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),h,m,0);
  const e=new Date(t-300000);
  if(e-n>0)setTimeout(()=>toast('⏰ 5 min mein: '+label),e-n);
  if(t-n>0)setTimeout(()=>toast('🔔 Time for: '+label),t-n);
}
function init(){
  load();
  document.getElementById('hdate').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  S.reminders.forEach(r=>schedRem(r.label,r.time));
  renderToday();updateBadge();
}
init();
</script>
</body>
